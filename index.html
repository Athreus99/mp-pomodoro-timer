<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cronômetro Pomodoro</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body class="pomodoro-mode">
  <!-- Container do Cronômetro -->
  <div class="container" id="container">
    <h1>Cronômetro Pomodoro</h1>
    <div class="timer-section">
      <div class="timer-display" id="timer">25:00</div>
      <div class="buttons">
        <button id="pomodoro">Pomodoro</button>
        <button id="short-break">Intervalo Curto</button>
        <button id="long-break">Intervalo Longo</button>
      </div>
      <button id="start">Começar</button>
    </div>
  </div>
  <!-- Barra de Tarefas -->
  <div class="task-input">
    <label for="task">TAREFA</label>
    <input type="text" id="task" placeholder="Escreva sua tarefa aqui...">
    <button id="add-task">Adicionar</button>
    <div class="task-list" id="task-list">
      <!-- Tarefas adicionadas aparecerão aqui -->
    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
